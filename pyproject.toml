[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-start-inventory-transfer"
version = "0.1.0"
description = "Reproducibility snapshot for cross-product transfer in zero-history initial inventory decisions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3",
  "pyyaml>=6", "pydantic>=2", "matplotlib>=3.8", "pyarrow>=14",
  "tqdm>=4.66", "joblib>=1.3",
  "openpyxl>=3.1", "xlrd>=2.0", "pyreadr>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7", "jupyter>=1", "ipykernel>=6", "pandas-stubs>=2.1", "types-PyYAML>=6"]
published-baseline = ["catboost>=1.2.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
packages = ["cold_start_replenishment"]

[[tool.mypy.overrides]]
module = [
  "cold_start_replenishment.data.spdf_pilot",
  "cold_start_replenishment.evaluation.spdf_pilot",
  "cold_start_replenishment.evaluation.m5_compact_pilot",
  "cold_start_replenishment.evaluation.sprint2",
  "cold_start_replenishment.evaluation.sprint2_statistics",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=cold_start_replenishment --cov-report=term-missing"
