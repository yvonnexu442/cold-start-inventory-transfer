random_seed: 20260805
audit_output_path: outputs/audits
minimum_active_history: 56
minimum_evaluation_horizon: 28
minimum_nonzero_observations: 5
maximum_sampled_series: 10000
onset_activity_window: 28
minimum_donor_candidates: 20
m5:
  path: data/raw/m5
  filenames:
    calendar: calendar.csv
    sales_validation: sales_train_validation.csv
    sales_evaluation: sales_train_evaluation.csv
    prices: sell_prices.csv
