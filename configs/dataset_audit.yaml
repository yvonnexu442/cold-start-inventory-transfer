  target_date_columns: [date]
  hierarchy_fields: [state_id, store_id, cat_id, dept_id, item_id]
car_parts:
  path: data/raw/car_parts
  filenames: {}
  target_date_columns: []
  hierarchy_fields: []
spdf:
  path: data/raw/spdf
  filenames:
    archive: Spare-Part-Demand-Forecasting-main.zip
  target_date_columns: []
  hierarchy_fields: []
aviation_synthetic:
  path: data/raw/aviation_synthetic
  filenames:
    demand: obj1_synthetic_demand.csv
  target_date_columns: [period_start_date]
  hierarchy_fields: [part_class, ata_chapter, aircraft_type, location_id]
